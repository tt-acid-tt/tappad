name: Build SupermarketTogehterXRAK (Windows)
on:
  workflow_dispatch:
  push:
    paths:
      - "SupermarketTogehterXRAK/**"
      - ".github/workflows/build-windows-game.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows x86_64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: SupermarketTogehterXRAK
          targetPlatform: StandaloneWindows64
          buildName: SupermarketTogehterXRAK.exe
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        with:
          name: SupermarketTogehterXRAK-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error
