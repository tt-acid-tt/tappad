name: Build Mytheria Visuals Menu

on:
  workflow_dispatch:
  push:
    paths:
      - 'MytheriaVisualsMenu/**'
      - '.github/workflows/build-mytheria-visuals.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MytheriaVisualsMenu
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build mod JAR
        run: gradle build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: MytheriaVisualsMenu-Minecraft-1.21.4
          path: MytheriaVisualsMenu/build/libs/*.jar
          if-no-files-found: error
